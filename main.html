    <style>
        /* Sunday · AsanaMind — core styles, aligned with Figma tokens */
        :root {
            --bg: #F5F2EB;
            --surface: #FFFFFF;
            --surface-2: #EEE9DE;
            --surface-3: #E0D9C8;
            --border: #D4CCB8;
            --text-1: #14120E;
            --text-2: #4A453B;
            --text-3: #7A7364;
            --text-4: #A8A294;
            --primary: #0F3D2E;
            --primary-2: #1F5A44;
            --primary-3: #6FA089;
            --primary-4: #C7DBCE;
            --accent: #C2552F;
            --accent-soft: #F6DACB;
            --highlight: #E0A23F;
            --highlight-2: #F3D58C;
        }

        html, body {
            background: var(--bg);
            color: var(--text-1);
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-display { font-family: 'Fraunces', ui-serif, Georgia, serif; letter-spacing: -0.02em; font-optical-sizing: auto; }
        .kicker {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 11px;
            line-height: 14px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .view-fade-in { animation: viewFadeIn 0.5s cubic-bezier(0.22, 0.8, 0.3, 1) forwards; }
        @keyframes viewFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .scrollable-content { overflow-y: auto; max-height: 300px; scrollbar-width: thin; }
        .scrollable-content::-webkit-scrollbar { width: 6px; }
        .scrollable-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

        .loading-animation {
            border: 3px solid rgba(31, 90, 68, 0.15);
            border-top: 3px solid var(--primary-2);
            border-radius: 50%;
            width: 28px; height: 28px;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .pressable { transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease; }
        .pressable:active { transform: scale(0.99); }

        .asana-tile {
            transition: transform 0.35s cubic-bezier(0.22, 0.8, 0.3, 1), box-shadow 0.35s ease;
            cursor: pointer;
        }
        .asana-tile:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px 0 rgba(20, 18, 14, 0.12);
        }

        .blob {
            position: absolute;
            border-radius: 9999px;
            pointer-events: none;
            filter: blur(120px);
        }

        #cursor-glow { display: none; }

        /* Voice assistant pulsing */
        @keyframes pulse-green {
            0%   { box-shadow: 0 0 0 0 rgba(111, 160, 137, 0.55); }
            70%  { box-shadow: 0 0 0 14px rgba(111, 160, 137, 0); }
            100% { box-shadow: 0 0 0 0 rgba(111, 160, 137, 0); }
        }
        @keyframes pulse-accent {
            0%   { box-shadow: 0 0 0 0 rgba(194, 85, 47, 0.55); }
            70%  { box-shadow: 0 0 0 14px rgba(194, 85, 47, 0); }
            100% { box-shadow: 0 0 0 0 rgba(194, 85, 47, 0); }
        }
        .voice-listening { animation: pulse-green 1.5s infinite; border-color: var(--primary-3) !important; }
        .voice-talking   { animation: pulse-accent 1.5s infinite; border-color: var(--accent) !important; }

        /* AR camera feed — capped height so score + controls stay visible below */
        #video-container {
            position: relative;
            width: 100%;
            height: calc(55vh - 60px);
            max-height: 360px;
            background-color: #0A100B;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--primary-2);
            box-shadow: 0 16px 40px 0 rgba(20, 18, 14, 0.18);
        }
        #video-feed {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            transform: scaleX(-1);
        }
        #ar-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        /* Modal — matches Figma pose detail */
        #asana-modal-backdrop {
            background: rgba(20, 18, 14, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #asana-modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }
        #asana-modal-content {
            transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #asana-modal-backdrop.active #asana-modal-content {
            transform: scale(1);
        }

        /* Shadows matching Figma elevation tokens */
        .shadow-1 { box-shadow: 0 2px 8px 0 rgba(20, 18, 14, 0.05); }
        .shadow-2 { box-shadow: 0 8px 24px 0 rgba(20, 18, 14, 0.08); }
        .shadow-3 { box-shadow: 0 16px 40px 0 rgba(20, 18, 14, 0.10); }

        /* Pill button variants — to match PrimaryPill in the Figma */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 9999px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            padding: 0 28px;
            height: 54px;
            border: 0;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.2s;
        }
        .btn:active { transform: scale(0.99); }
        .btn-primary { background: var(--primary); color: var(--bg); }
        .btn-primary:hover { background: var(--primary-2); }
        .btn-accent { background: var(--accent); color: var(--bg); }
        .btn-accent:hover { filter: brightness(1.05); }
        .btn-cream { background: var(--bg); color: var(--text-1); }
        .btn-cream:hover { background: var(--surface-2); }
        .btn-secondary {
            background: transparent;
            color: var(--text-1);
            border: 1.5px solid var(--text-1);
        }
        .btn-ghost-dark {
            background: transparent;
            color: var(--primary-4);
            border: 1.5px solid var(--primary-3);
        }
        .btn-sm { height: 40px; padding: 0 18px; font-size: 13px; }

        /* Photo cards */
        .pose-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(0.88) contrast(1.02);
            display: block;
        }

        .veil-b {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(20,18,14,0) 0%, rgba(20,18,14,0.55) 60%, rgba(20,18,14,0.85) 100%);
        }
        .veil-dark {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(15,61,46,0.55) 0%, rgba(15,61,46,0.15) 35%, rgba(15,61,46,0.65) 75%, rgba(15,61,46,0.92) 100%);
        }

        /* Hide Tailwind's `h-[xxx]` media query warnings by using safe CSS only */
        .hide-scroll { scrollbar-width: none; -ms-overflow-style: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }

        /* Accessibility: high-contrast mode (item 35) */
        body.high-contrast { background: #000 !important; color: #FFF !important; }
        body.high-contrast .topbar { background: rgba(0,0,0,0.95) !important; border-color: #444 !important; }
        body.high-contrast .asana-tile { background: #111 !important; border: 2px solid #E0A23F !important; }
        body.high-contrast .btn-accent { background: #E0A23F !important; color: #000 !important; }
        body.high-contrast .kpi, body.high-contrast .chart-card { background: #111 !important; }
        /* Colourblind-safe: use patterns + shapes instead of red/green alone */
        body.high-contrast canvas { filter: saturate(0.5) contrast(1.3); }
    </style>

</head>

    <script>
        // --- Firebase and Environment Setup (Required variables for Canvas runtime) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        // FIX: Corrected variable reference from __initialAuthToken to __initial_auth_token
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- Mock Data ---
        // asanaData is loaded from /static/poses.js (20 poses + rule engine)

        // --- MoveNet/AR Correction Globals ---
        let videoStream = null;
        let detector = null;
        let animationFrameId = null;
        let currentPose = null; // The pose the user selects

        // --- Suggestion Stabilization Variables ---
        let suggestionBuffer = []; // Stores recent correction messages
        const BUFFER_SIZE = 5; // Number of frames to buffer before changing suggestion
        let stableSuggestion = null; // Current stable suggestion being displayed
        let correctionCounter = 0; // Frame counter for stabilization

        // --- Scoring System Variables ---
        let poseScore = 100; // Start at perfect score
        let scoreHistory = []; // Track score over time for averaging

        // --- Milestone Tracking Variables ---
        let milestonesEarned = parseInt(localStorage.getItem('milestonesEarned') || '0');
        let highAccuracyTimer = 0; // Counts frames with 70%+ accuracy
        let lastMilestoneTime = 0; // Prevents double-counting

        // Define expected body parts and confidence score threshold
        const keypointIndices = {
            'nose': 0, 'left_eye': 1, 'right_eye': 2, 'left_ear': 3, 'right_ear': 4,
            'left_shoulder': 5, 'right_shoulder': 6, 'left_elbow': 7, 'right_elbow': 8,
            'left_wrist': 9, 'right_wrist': 10, 'left_hip': 11, 'right_hip': 12,
            'left_knee': 13, 'right_knee': 14, 'left_ankle': 15, 'right_ankle': 16
        };
        const MIN_CONFIDENCE = 0.3; // Minimum score for a keypoint to be considered valid

        // The correct connections for MoveNet's 17 keypoints (indices 0-16)
        const SKELETON_CONNECTIONS = [
            [0, 1], [0, 2], [1, 3], [2, 4], // Head/Face
            [5, 6], // Shoulders
            [5, 7], [7, 9], // Left arm
            [6, 8], [8, 10], // Right arm
            [5, 11], [6, 12], // Torso upper
            [11, 12], // Torso lower/Hips
            [11, 13], [13, 15], // Left leg
            [12, 14], [14, 16] // Right leg
        ];

        /**
         * Converts a hex colour string to rgba() with the given alpha.
         * Used by drawSkeleton's confidence-weighted gradient bones so
         * low-confidence keypoints fade out rather than render at full
         * opacity (which looks like a flicker).
         */
        function hexWithAlpha(hex, alpha) {
            const h = (hex || '#1E88E5').replace('#', '');
            const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
            const r = parseInt(full.slice(0, 2), 16);
            const g = parseInt(full.slice(2, 4), 16);
            const b = parseInt(full.slice(4, 6), 16);
            const a = Math.max(0.15, Math.min(1, alpha));
            return `rgba(${r},${g},${b},${a})`;

        // --- API Configuration and Helper (Moved outside app object) ---
        const OPENROUTER_MODEL = "google/gemini-2.0-flash-001";
        const VIRTUAL_ASSISTANT_SYSTEM_PROMPT = "You are SUNDAY, a supportive, knowledgeable, and certified yoga and wellness assistant. Your tone is calming and encouraging. Provide concise, helpful answers. For yoga pose questions, include the Sanskrit name and a brief description of the benefit. Always format your advice clearly. Keep responses brief (2-3 sentences max).";

        window.app = {

            // Course State — generated from the full 20-pose ASANA_LIBRARY
            courseProgress: (function(){

                if (saved) { try { return JSON.parse(saved); } catch(e){} }
                const lib = (typeof ASANA_LIBRARY !== 'undefined') ? ASANA_LIBRARY : [];
                const poses = lib.map((a, i) => ({

            courseHoldTime: 0,

            /**
             * Calls the OpenRouter API for the Virtual Assistant feature.
             * Enhanced with better error handling, logging, and fallback responses.
             */
            async callGeminiAssistant(prompt) {
                // Route through our Flask proxy. It holds the server-side
                // API key, handles CORS, and returns a curated yoga fallback
                // when the upstream AI is unreachable — so the user never
                // hears "service unavailable".
                //
                // We attach a lightweight context snapshot so the model can
                // answer "what is this?" with awareness of the current
                // screen / pose / score / level.
                const ctx = this.buildAssistantContext ? this.buildAssistantContext() : {};

                // Try the local offline knowledge base first. If it has a
                // direct hit (pose question or history question) we short-
                // circuit — faster than the round trip and guaranteed to work
                // without a network or API key.
                try {
                    if (window.VoiceKB && window.VoiceKB.answer) {
                        // Conversational memory — resolve pronouns like "show me"
                        // or "its benefits" to the last-mentioned pose.
                        let resolvedPrompt = prompt;
                        if (window.VoiceKB.ConvMemory) {
                            const resolved = window.VoiceKB.ConvMemory.resolvePronouns(prompt);
                            if (resolved) resolvedPrompt = prompt + ' ' + resolved;
                        }
                        const local = window.VoiceKB.answer(resolvedPrompt, ctx);
                        if (local) {
                            // Record the turn for future pronoun resolution.
                            if (window.VoiceKB.ConvMemory) {
                                const poseMentioned = window.VoiceKB.fuzzyPoseMatch(prompt);
                                window.VoiceKB.ConvMemory.push({ role: 'user', text: prompt, poseMentioned });
                                window.VoiceKB.ConvMemory.push({ role: 'assistant', text: local });
                            }
                            return { text: local, source: 'offline-kb' };
                        }
                    }
                } catch (e) { console.warn('VoiceKB.answer error', e); }

                // RAG fallback — tf-idf retrieval over POSE_CARDS + SYMPTOM_KB.
                try {
                    if (window.VoiceKB && window.VoiceKB.ragAnswer) {
                        let resolvedPrompt = prompt;
                        if (window.VoiceKB.ConvMemory) {
                            const resolved = window.VoiceKB.ConvMemory.resolvePronouns(prompt);
                            if (resolved) resolvedPrompt = prompt + ' ' + resolved;
                        }
                        const ragReply = window.VoiceKB.ragAnswer(resolvedPrompt);
                        if (ragReply) {
                            if (window.VoiceKB.ConvMemory) {
                                const poseMentioned = window.VoiceKB.fuzzyPoseMatch(prompt);
                                window.VoiceKB.ConvMemory.push({ role: 'user', text: prompt, poseMentioned });
                                window.VoiceKB.ConvMemory.push({ role: 'assistant', text: ragReply });
                            }
                            return { text: ragReply, source: 'offline-rag' };
                        }
                    }
                } catch (e) { console.warn('VoiceKB.ragAnswer error', e); }

                try {
                    const res = await fetch('/api/assistant', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'same-origin',
                        body: JSON.stringify({ prompt, context: ctx }),
                    });
                    if (!res.ok) {
                        return { text: 'Let me stay with the breath for a moment. Ask me about a pose or a specific focus.' };
                    }
                    const data = await res.json();
                    return { text: data.text || 'I am here with you. Ask me about a pose.', source: data.source };
                } catch (e) {
                    console.warn('[Sunday AI] network error:', e && e.message);
                    return { text: 'I cannot reach the assistant right now. Try asking about Tadasana or breathing and I will help offline.' };
                }
            },

            /**
             * Produces a lightweight snapshot of what the user is looking at

            buildAssistantContext() {
                const viewLabels = {
                    dashboard: 'Home / Today',
                    asana: 'Asana library',

                    course: 'Certificate course',

                const ctx = {

                if (ctx.pose && typeof ASANA_LIBRARY !== 'undefined') {
                    const a = ASANA_LIBRARY.find(x => x.name === ctx.pose);

                        ctx.poseSanskrit = a.sanskrit;

                        ctx.poseView = a.view;
                        ctx.poseBenefits = a.benefits || null;
                    }

                if (this.currentView === 'course' && this.courseProgress) {
                    const done = (this.courseProgress.poses || []).filter(p => p.completed).length;
                    ctx.courseCompleted = done;
                    ctx.courseTotal = (this.courseProgress.poses || []).length;
                }
                return ctx;
            },

            // --- Voice Command Integration ---
            setupVoiceCommands() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                const toggleBtn = document.getElementById('voice-toggle');
                const statusText = document.getElementById('mic-status-text');

                if (!SR) {
                    if (statusText) statusText.textContent = 'Voice N/A';
                    if (toggleBtn) toggleBtn.disabled = true;
                    console.warn('Speech Recognition not supported in this browser.');
                    return;
                }

                this.recognitionInstance = new SR();
                this.recognitionInstance.continuous = false;
                this.recognitionInstance.interimResults = false;
                this.recognitionInstance.lang = 'en-US';
                this.recognitionInstance.maxAlternatives = 3;

                const micIcon = document.getElementById('mic-icon');

                const updateMicStatus = (listening, label) => {
                    this.isListening = listening;
                    if (micIcon) {
                        if (listening) micIcon.classList.add('text-terracotta-600', 'animate-pulse');
                        else micIcon.classList.remove('animate-pulse');
                    }
                    if (toggleBtn) {
                        if (listening) toggleBtn.classList.add('voice-listening');
                        else toggleBtn.classList.remove('voice-listening', 'voice-talking');
                    }
                    if (statusText) statusText.textContent = label || (listening ? 'Listening' : 'Voice');
                };

                this.recognitionInstance.onstart = () => updateMicStatus(true, 'Listening');

                // ─── COMMAND DISPATCH TABLE ───
                // Priority order: specific commands FIRST, AI fallthrough LAST.
                // Each entry: { re: RegExp, handler: (transcript, app) => void }
                // The handler must return something truthy to short-circuit
                // the AI fallthrough. Returning undefined / false means
                // "not handled — try the next rule".
                const COMMANDS = [
                    // ── Control (must come first so "voice off" beats everything) ──
                    { re: /\b(voice off|stop listening|turn off mic|mute mic|pause voice)\b/, h: (t, app) => {
                        app.isListening = false;
                        try { app.recognitionInstance.stop(); } catch(_){}
                        app.speakCorrection('Voice off.', true);
                        updateMicStatus(false, 'Off');
                        return true;
                    }},
                    // ── Reference overlay (in-session) ──
                    { re: /\breference\b|\bshow (\w+ ){0,3}(pose|image|picture|photo|reference)\b/, h: (t, app) => {
                        if (app.currentPose) {
                            app.showReferenceOverlay(app.currentPose, 5000);
                            app.speakCorrection('Showing reference.', true);
                            updateMicStatus(true, 'Reference');
                        } else {
                            app.speakCorrection('Pick a pose first, then say reference.', true);
                        }
                        return true;
                    }},
                    // ── Score (also handles question forms) ──
                    { re: /\b((what(?:'s|s| is)? (my|the)) ?(score|accuracy|alignment)|how am i doing|what's my score|score|accuracy|alignment)\b/, h: (t, app) => {
                        if (!app.currentPose) { app.speakCorrection('Start a pose first, then ask for your score.', true); return true; }
                        const s = Math.round(app._lastPoseScore || 0);
                        const msg = s >= 85 ? 'You are at ' + s + ' percent. Beautiful form. Hold and breathe.'
                                   : s >= 70 ? 'You are at ' + s + ' percent. Small refinements will bring you home.'
                                   : s >= 50 ? 'You are at ' + s + ' percent. Check the reference and ease toward it.'
                                             : 'You are at ' + s + ' percent. Take a breath and re-enter the pose gently.';
                        app.speakCorrection(msg, true);
                        updateMicStatus(true, 'Score: ' + s);
                        return true;
                    }},
                    // ── Next pose ──
                    { re: /\b(next pose|next asana|next one|go next|skip this)\b|^next$/, h: (t, app) => {
                        if (!app.currentPose) return false;
                        const lib = (typeof ASANA_LIBRARY !== 'undefined') ? ASANA_LIBRARY : [];
                        const idx = lib.findIndex(a => a.name === app.currentPose);
                        const nxt = lib[(idx + 1) % lib.length];
                        if (nxt) {
                            // Transition hint — item 11. Natural language
                            // guidance from this pose to the next.
                            let opener = 'Next, ' + nxt.sanskrit + '.';
                            try {
                                if (window.PracticeFlow && window.PracticeFlow.TransitionHint) {
                                    const hint = window.PracticeFlow.TransitionHint.hintFor(nxt.name);
                                    if (hint) opener += ' ' + hint;
                                }
                            } catch(_){}
                            app.speakCorrection(opener, true);
                            setTimeout(() => app.selectAsanaAndStart(nxt.name), 500);
                            updateMicStatus(true, 'Next');
                        }
                        return true;
                    }},
                    // ── Previous pose ──
                    { re: /\b(previous pose|previous one|go back|back pose|last one)\b|^previous$|^back$/, h: (t, app) => {
                        if (!app.currentPose) return false;
                        const lib = (typeof ASANA_LIBRARY !== 'undefined') ? ASANA_LIBRARY : [];
                        const idx = lib.findIndex(a => a.name === app.currentPose);
                        const prev = lib[(idx - 1 + lib.length) % lib.length];
                        if (prev) {
                            app.speakCorrection('Back to ' + prev.sanskrit + '.', true);
                            setTimeout(() => app.selectAsanaAndStart(prev.name), 500);
                            updateMicStatus(true, 'Previous');
                        }
                        return true;
                    }},
                    // ── Stop AR session ──
                    { re: /\b(stop practice|end practice|end session|stop tracking|exit practice|finish practice)\b|^stop$|^end$|^quit$|^exit$|^finish$|^done$/, h: (t, app) => {
                        if (!app.currentPose) return false;
                        if (app.stopARAssessment) app.stopARAssessment();
                        app.speakCorrection('Stopping practice.', true);
                        updateMicStatus(true, 'Stopped');
                        return true;
                    }},
                    // ── Repeat last cue ──
                    { re: /\b(repeat|say again|one more time|say it again)\b|^again$/, h: (t, app) => {
                        if (app._lastSpokenMessage) {
                            try { window.speechSynthesis.cancel(); } catch(_){}
                            const u = new SpeechSynthesisUtterance(app._lastSpokenMessage);
                            u.rate = 0.95; u.pitch = 1.0; u.volume = 1.0;
                            window.speechSynthesis.speak(u);

                            app.speakCorrection('Nothing to repeat yet.', true);

                    }},
                    // ── Voice guide on ──
                    { re: /\b(voice guide on|turn on voice|talk to me|start voice|enable voice|speak to me)\b/, h: (t, app) => {

                    { re: /\b(voice guide off|turn off voice|be quiet|stop talking|silent mode|no talking)\b/, h: (t, app) => {

                    }},
                    // ── Diagnostics toggle ──

                    }},
                    // ── Read screen ──
                    { re: /\b(read (this|the) (screen|page)|what's on screen|what is on screen|describe this page|read it to me)\b/, h: (t, app) => {

                    }},

                    { re: /\b(my (stats|progress|streak)|(what|show|tell me)('s| is|s)? (my )?(stats|progress|streak|sessions|active days|days)|how many (sessions|days|poses)|poses learned)\b/, h: (t, app) => {
                        if (app.speakMyStats) app.speakMyStats();

                    }},
                    // ── Recommend a pose ──
                    { re: /\brecommend\b|\bsuggest (a )?pose\b|\bwhat should i (do|practise|practice)\b|\bpick (a |for me|one)\b|\brandom pose\b|\bsurprise me\b/, h: (t, app) => {
                        if (app.recommendPose) app.recommendPose();
                        updateMicStatus(true, 'Picking');
                        return true;
                    }},
                    // ── Start course / certificate ──
                    { re: /\b(start (the )?course|begin (the )?course|take the course|test me|begin test|certificate|my certificate)\b/, h: (t, app) => {
                        app.navigate('course');
                        app.speakCorrection('Opening the course.', true);
                        updateMicStatus(true, 'Course');

                    }},
                    // ── Breathing / calm ──
                    { re: /\b(breathe with me|breathing exercise|breath exercise|calm me|calm down|i('m| am) anxious|anxiety|help me relax|box breath)\b/, h: (t, app) => {
                        if (app.guidedBreath) app.guidedBreath();
                        updateMicStatus(true, 'Breathing');
                        return true;
                    }},
                    // ── Timed hold (item 16) ──
                    { re: /\b(hold for |count down|timer |time me|timed hold|start timer)\b|^timer$|^hold$/, h: (t, app) => {
                        // Parse duration if user says "hold for 30 seconds".
                        const m = t.match(/(\d+)\s*(second|sec|minute|min)/);
                        let secs = 30;
                        if (m) { secs = parseInt(m[1], 10) * ((/min/).test(m[2]) ? 60 : 1); }
                        secs = Math.max(5, Math.min(120, secs));

                        updateMicStatus(true, 'Hold ' + secs + 's');

                    }},
                    // ── Breath pacing overlay (item 17) ──
                    { re: /\b(breath pacing|pace (my |the )?breath|breath circle|breathing circle)\b/, h: (t, app) => {
                        if (app.toggleBreathPacing) app.toggleBreathPacing();
                        updateMicStatus(true, 'Breath pacing');

                    }},
                    // ── Command library ──
                    { re: /\b(commands|command library|list commands|what can you do|what can i say|show me commands|help me|show help)\b/, h: (t, app) => {
                        if (app.openCommandLibrary) app.openCommandLibrary();

                        updateMicStatus(true, 'Commands');
                        return true;
                    }},
                    // ── Accessibility: font size (item 34) ──
                    { re: /\b(bigger text|larger text|smaller text|text size|font size|increase font|decrease font)\b/, h: (t, app) => {
                        if (app.cycleFontSize) app.cycleFontSize();
                        updateMicStatus(true, 'Text size');
                        return true;
                    }},
                    // ── Accessibility: high contrast (item 35) ──
                    { re: /\b(high contrast|contrast mode|dark mode|colou?rblind|accessibility)\b/, h: (t, app) => {
                        document.body.classList.toggle('high-contrast');
                        const on = document.body.classList.contains('high-contrast');
                        app.speakCorrection(on ? 'High contrast on.' : 'High contrast off.', true);
                        updateMicStatus(true, on ? 'Contrast on' : 'Contrast off');
                        return true;
                    }},
                    // ── Navigation (require "go to" or "open" prefix so
                    //     "what is the course" doesn't navigate) ──
                    { re: /\b(go (to )?home|open home|take me home|go (to )?today|open today)\b/, h: (t, app) => { app.navigate('dashboard'); app.speakCorrection('Home.', true); return true; }},
                    { re: /\b(go (to )?library|open library|show library|open (the )?poses|show (the )?poses)\b/, h: (t, app) => { app.navigate('asana'); app.speakCorrection('Library.', true); return true; }},
                    { re: /\b(go (to )?practice|open practice|start practice|open (the )?camera)\b/, h: (t, app) => { app.navigate('ar_correction'); app.speakCorrection('Practice.', true); return true; }},
                    { re: /\b(go (to )?course|open course|show course)\b/, h: (t, app) => { app.navigate('course'); app.speakCorrection('Course.', true); return true; }},
                    { re: /\b(open profile|my profile|show profile|go to profile)\b/, h: (t, app) => {
                        app.speakCorrection('Opening your profile.', true);
                        setTimeout(() => window.location.href = '/profile', 600);
                        return true;
                    }},
                    { re: /\b(logout|log out|sign out|sign me out)\b/, h: (t, app) => {
                        app.speakCorrection('Logging out.', true);
                        setTimeout(() => window.location.href = '/logout', 800);
                        return true;
                    }},
                ];

                // Pose name / alias matcher — only fires if none of the
                // commands above matched. "Start Tadasana" / "Open Warrior II".
                const POSE_ALIASES = {
                    'tree': 'Vrikshasana', 'mountain': 'Tadasana', 'prayer': 'Anjali Mudra',
                    'namaste': 'Anjali Mudra',
                    'downward dog': 'Adho Mukha Svanasana', 'down dog': 'Adho Mukha Svanasana',
                    'downward facing dog': 'Adho Mukha Svanasana',
                    'warrior one': 'Virabhadrasana I', 'warrior 1': 'Virabhadrasana I',
                    'warrior two': 'Virabhadrasana II', 'warrior 2': 'Virabhadrasana II',
                    'warrior three': 'Virabhadrasana III', 'warrior 3': 'Virabhadrasana III',
                    'triangle': 'Utthita Trikonasana', 'extended triangle': 'Utthita Trikonasana',
                    'chair': 'Utkatasana', 'chair pose': 'Utkatasana',
                    'side angle': 'Utthita Parsvakonasana', 'extended side angle': 'Utthita Parsvakonasana',
                    'bridge': 'Setu Bandhasana', 'bridge pose': 'Setu Bandhasana',
                    'half moon': 'Ardha Chandrasana', 'dancer': 'Natarajasana', 'dancer pose': 'Natarajasana',
                    'child': 'Balasana', 'child pose': 'Balasana', 'childs pose': 'Balasana',
                    'easy': 'Sukhasana', 'easy seat': 'Sukhasana', 'easy pose': 'Sukhasana',
                    'staff': 'Dandasana', 'staff pose': 'Dandasana',
                    'bound angle': 'Baddha Konasana', 'butterfly': 'Baddha Konasana',
                    'forward fold': 'Paschimottanasana', 'seated forward fold': 'Paschimottanasana',
                    'standing forward fold': 'Uttanasana', 'rag doll': 'Uttanasana',
                    'upward salute': 'Urdhva Hastasana', 'reach up': 'Urdhva Hastasana',
                    'mountain pose': 'Tadasana', 'tree pose': 'Vrikshasana',
                };

                const tryPoseMatch = (t) => {
                    const lib = (typeof ASANA_LIBRARY !== 'undefined') ? ASANA_LIBRARY : [];
                    // Only attempt pose match if the transcript has a verb
                    // prefix or is 1-3 words long (i.e. the user is naming
                    // a pose, not asking a question about it).
                    const hasVerb = /\b(start|do|open|go to|practice|practise|take me to|begin|switch to)\b/.test(t);
                    const shortPhrase = t.split(/\s+/).length <= 3;
                    if (!hasVerb && !shortPhrase) return null;
                    for (const alias of Object.keys(POSE_ALIASES)) {
                        if (t.includes(alias)) return lib.find(a => a.name === POSE_ALIASES[alias]);
                    }
                    const exact = lib.find(a => {
                        const ln = a.name.toLowerCase();
                        const ls = (a.sanskrit || '').toLowerCase();
                        return t.includes(ln) || (ls && t.includes(ls));
                    });
                    if (exact) return exact;

                    // Last-chance fuzzy match via VoiceKB (handles "tar dusana"
                    // → Tadasana, "re shassana" → Vrikshasana, etc.).
                    if (window.VoiceKB && window.VoiceKB.fuzzyPoseMatch) {
                        const key = window.VoiceKB.fuzzyPoseMatch(t);
                        if (key) {
                            // Map POSE_CARDS key back to ASANA_LIBRARY entry by
                            // comparing lowercased names.
                            return lib.find(a => a.name.toLowerCase() === key);
                        }
                    }
                    return null;
                };

                this.recognitionInstance.onresult = async (event) => {
                    // Try every alternative the engine returned — one of
                    // them may be what the user actually said.
                    const last = event.results.length - 1;
                    const alts = event.results[last];
                    const transcripts = [];
                    for (let i = 0; i < alts.length; i++) {
                        const raw = (alts[i].transcript || '').toLowerCase().trim();
                        const cleaned = raw.replace(/^[.,!?;:"'`\-\s]+|[.,!?;:"'`\-\s]+$/g, '').trim();
                        if (cleaned) transcripts.push(cleaned);
                    }
                    if (!transcripts.length) return;
                    console.log('Voice alternatives:', transcripts);
                    // Surface the top alternative so the user sees what was heard
                    updateMicStatus(true, 'Heard: ' + transcripts[0].slice(0, 24));

                    // 1) Try every command rule against every alternative.
                    //    First match wins.
                    for (const t of transcripts) {
                        for (const cmd of COMMANDS) {
                            if (cmd.re.test(t)) {
                                try { if (cmd.h(t, this)) return; } catch (e) { console.warn('cmd handler error', e); }
                            }
                        }
                    }

                    // 2) Try pose match on every alternative.
                    for (const t of transcripts) {
                        const matched = tryPoseMatch(t);
                        if (matched) {
                            this.navigate('ar_correction');
                            this.speakCorrection('Opening ' + matched.sanskrit + '.', true);
                            setTimeout(() => this.selectAsanaAndStart(matched.name), 500);
                            updateMicStatus(true, 'Opening');
                            return;
                        }
                    }

                    // 3) Everything else → AI assistant (using the top alternative).
                    updateMicStatus(true, 'Thinking');
                    try {
                        const response = await this.callGeminiAssistant(transcripts[0]);
                        // Force-speak the AI reply even if voice-guide is off
                        // (the user asked a question, they expect an answer).
                        this.speakCorrection(response.text || 'Not sure about that.', true);
                        updateMicStatus(true, 'Answered');
                    } catch (e) {
                        console.error('AI voice error:', e);
                        this.speakCorrection('Try asking about a specific pose, or say commands.', true);
                        updateMicStatus(true, 'Try again');
                    }
                };

                this.recognitionInstance.onerror = (event) => {
                    console.error('Speech Recognition Error:', event.error);
                    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                        this.isListening = false;
                        updateMicStatus(false, 'Blocked');
                        alert('Microphone access is blocked. Enable it in your browser settings and reload.');
                    } else if (event.error === 'audio-capture') {
                        updateMicStatus(false, 'No mic');
                    } else if (event.error !== 'no-speech') {
                        updateMicStatus(false, 'Error');
                    }
                };

                this.recognitionInstance.onend = () => {
                    // With continuous=false the recogniser ends after each
                    // utterance. Restart it immediately while the user keeps
                    // the mic on — this gives rock-solid "always listening"
                    // behaviour across Chrome, Edge, Safari, and Android.
                    if (this.isListening) {
                        setTimeout(() => {
                            try { this.recognitionInstance.start(); }
                            catch (e) {
                                // InvalidStateError: already started — safe to ignore
                                if (!String(e).includes('already started')) {
                                    console.warn('Voice restart failed:', e);
                                    updateMicStatus(false, 'Off');
                                }
                            }
                        }, 200);
                    } else {
                        updateMicStatus(false, 'Voice');
                    }
                };
            },

                gradient.addColorStop(0.5, '#2D3748');
                gradient.addColorStop(1, '#1E1E1E');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Border
                ctx.strokeStyle = '#42A5F5';
                ctx.lineWidth = 10;
                ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

                ctx.strokeStyle = '#FFEB3B';
                ctx.lineWidth = 3;
                ctx.strokeRect(60, 60, canvas.width - 120, canvas.height - 120);

                // Title
                ctx.fillStyle = '#42A5F5';
                ctx.font = 'bold 72px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('CERTIFICATE OF ACHIEVEMENT', canvas.width / 2, 180);

                // Subtitle
                ctx.fillStyle = '#FFEB3B';
                ctx.font = '32px Inter, sans-serif';
                ctx.fillText('SUNDAY Yoga & Wellness Platform', canvas.width / 2, 240);

                // Body text
                ctx.fillStyle = '#E0E0E0';
                ctx.font = '28px Inter, sans-serif';
                ctx.fillText('This certifies that', canvas.width / 2, 340);

                // User name (you can customize this)
                ctx.fillStyle = '#FFEB3B';
                ctx.font = 'bold 48px Inter, sans-serif';
                ctx.fillText('Yoga Practitioner', canvas.width / 2, 420);

                // Achievement text
                ctx.fillStyle = '#E0E0E0';
                ctx.font = '26px Inter, sans-serif';
                ctx.fillText('has successfully completed', canvas.width / 2, 490);
                ctx.fillText('2 Milestone Achievements', canvas.width / 2, 530);
                ctx.fillText('by maintaining 70%+ posture accuracy', canvas.width / 2, 570);
                ctx.fillText('for 20 seconds during practice sessions', canvas.width / 2, 610);

                // Date
                const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                ctx.fillStyle = '#42A5F5';
                ctx.font = '24px Inter, sans-serif';
                ctx.fillText(`Awarded on ${today}`, canvas.width / 2, 720);

                // Signature line
                ctx.strokeStyle = '#42A5F5';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(400, 800);
                ctx.lineTo(800, 800);
                ctx.stroke();

                ctx.fillStyle = '#E0E0E0';
                ctx.font = 'italic 22px Inter, sans-serif';
                ctx.fillText('SUNDAY Platform', canvas.width / 2, 835);

                // Convert to download
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);

                    a.href = url;
                    a.download = `SUNDAY_Certificate_${Date.now()}.png`;
                    document.body.appendChild(a);

                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });

            /**
             * Speak a real-time pose correction with severity-aware latency.
             *
             * Priority-tiered gaps (vs the old flat 6 s):
             *   Priority 1 (safety): 1500 ms — can interrupt a lower-priority cue mid-sentence
             *   Priority 2 (form):   3500 ms — waits for the current utterance to end
             *   Priority 3 (fine):   6000 ms — only speaks when nothing else is happening
             *
             * Shape of `arg`:
             *   - string                                   → legacy path, treated as priority 3
             *   - { message, shortMessage?, priority?, severity? } → new path
             *
             * `force=true` (from voice assistant commands) always speaks now.
             */
            speakCorrection(arg, force = false) {
                if (!('speechSynthesis' in window)) {
                    console.warn('Text-to-Speech not supported in this browser');
                    return;
                }

                // Normalise the argument so both legacy and new callers work.
                let message, shortMessage, priority, severity;
                if (typeof arg === 'string') {
                    message = arg; shortMessage = arg; priority = 3; severity = 'yellow';
                } else if (arg && typeof arg === 'object') {
                    message = arg.message || '';
                    shortMessage = arg.shortMessage || arg.message || '';
                    priority = arg.priority || 3;
                    severity = arg.severity || (priority === 1 ? 'red' : priority === 2 ? 'yellow' : 'blue');
                } else {
                    return;
                }
                if (!message) return;

                const now = Date.now();

                // Forced speech (voice command replies, urgent notifications)
                // bypasses the tier gap but still cancels anything in flight.
                if (force) {
                    try { window.speechSynthesis.cancel(); } catch(_){}
                    this._speakNow(message, priority);
                    this._lastSpokenMessage = message;
                    this._lastSpokenAt = now;
                    this._lastSpokenPriority = priority;
                    return;
                }

                if (!this.ttsEnabled) return;

                // Severity-tiered minimum gap between distinct cues.
                const TIER_GAP = { 1: 1500, 2: 3500, 3: 6000 };
                const gap = TIER_GAP[priority] || 6000;
                const lastAt = this._lastSpokenAt || 0;
                const lastPri = this._lastSpokenPriority || 3;

                // Same message within its own tier gap → drop.
                if (this._lastSpokenMessage === message && (now - lastAt) < gap) return;

                // Something is currently speaking.
                if (this.isSpeaking || window.speechSynthesis.speaking) {
                    // Pre-empt: priority 1 cuts off anything lower-priority.
                    if (priority === 1 && lastPri >= 2) {
                        try { window.speechSynthesis.cancel(); } catch(_){}
                        // Tiny tick earcon so the user perceives the interrupt.
                        this._tickEarcon();
                        this._speakNow(shortMessage || message, priority);
                        this._lastSpokenMessage = message;
                        this._lastSpokenAt = now;
                        this._lastSpokenPriority = priority;
                        return;
                    }
                    // Otherwise let the current utterance finish.
                    return;
                }

                // Nothing speaking — respect the tier gap from the last cue.
                if ((now - lastAt) < gap) return;

                // Use the short form for rapid-fire priority-1 cues, full form otherwise.
                const toSay = priority === 1 ? (shortMessage || message) : message;
                this._speakNow(toSay, priority);
                this._lastSpokenMessage = message;
                this._lastSpokenAt = now;
                this._lastSpokenPriority = priority;
            },

            /** Internal: actually queue the utterance. */
            _speakNow(text, priority) {
                const u = new SpeechSynthesisUtterance(text);
                // Priority 1 speaks a touch faster and higher — urgency cue.
                u.rate = priority === 1 ? 1.05 : 0.95;
                u.pitch = priority === 1 ? 1.08 : 1.02;
                u.volume = 1.0;
                u.lang = 'en-US';
                u.onstart = () => { this.isSpeaking = true; };
                u.onend = () => {
                    this.isSpeaking = false;
                    // After this utterance ends, speak a queued second cue
                    // (from multi-rule correction) once there's a small pause.
                    if (this._queuedCorrection) {
                        const next = this._queuedCorrection;
                        this._queuedCorrection = null;
                        setTimeout(() => {
                            if (this.ttsEnabled && !this.isSpeaking && !window.speechSynthesis.speaking) {
                                this.speakCorrection(next);
                            }
                        }, 400);
                    }
                };
                u.onerror = (e) => {
                    console.warn('TTS Error:', e && e.error);
                    this.isSpeaking = false;
                };
                window.speechSynthesis.speak(u);
            },

            /** Short WebAudio click — used when interrupting a lower-priority cue. */
            _tickEarcon() {
                try {
                    if (!this._audioCtx) this._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const ctx = this._audioCtx;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.001, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.15);
                } catch(_){}
            },

            /**

            selectAsanaAndStart(poseName) {

                if (arSession) arSession.style.display = 'block';

                // Reset the engine: clear smoothing + hysteresis for the new pose.
                if (typeof PoseEngine !== 'undefined' && PoseEngine.reset) {
                    PoseEngine.reset();
                }
                // Reset voice throttle
                this._lastSpokenMessage = null;
                this._lastSpokenAt = 0;

                // Find the asana data
                const asana = asanaData.find(a => a.name === poseName);

                // Show and populate reference container
                const referenceContainer = document.getElementById('reference-container');

                    document.getElementById('reference-precaution').textContent = asana.precaution;

                // Load reference image if available
                this.loadReferenceImage(poseName);

                // Reset scoring system
                poseScore = 100;

                // Reset suggestion stabilization
                suggestionBuffer = [];

                const correctionLog = document.getElementById('correction-log');
                if (correctionLog) {
                    correctionLog.innerHTML = '<span class="kicker" style="color:#6FA089">Correction log</span>';

                this.startARAssessment();

                // Speak the pose-specific opening line once the session

            /**

                        const total = this.courseProgress ? this.courseProgress.poses.length : 0;
                        msg = 'You are in the course. ' + done + ' of ' + total + ' poses complete. Hold each pose at ninety percent for ten seconds to pass.';

                    default:
                        msg = 'You are in Sunday. Ask me to open home, library, practice, course, or profile.';
                }
                this.speakCorrection(msg, true);
            },

            /**
             * Speaks the user's practice stats — answers "my stats" /
             * "how many sessions". Pulls from the dashboard user object
             * when available, falls back to a gentle prompt.
             */
            async speakMyStats() {
                // Start with local history — gives an immediate answer even
                // offline. Then augment with server stats if available.
                const parts = [];
                try {
                    if (window.VoiceHistory) {
                        const s = window.VoiceHistory.summary();
                        if (s.thisWeek.count) {
                            parts.push(`This week: ${s.thisWeek.count} sessions at ${Math.round(s.thisWeek.avg)} percent alignment.`);
                            if (s.lastWeek.count) {
                                const diff = Math.round(s.thisWeek.avg - s.lastWeek.avg);
                                if (Math.abs(diff) >= 3) parts.push(`That's ${Math.abs(diff)} points ${diff > 0 ? 'up' : 'down'} vs last week.`);
                            }
                        }
                        const weak = window.VoiceHistory.weakest();
                        if (weak) parts.push(`Your focus area is ${weak.poseSanskrit || weak.pose} at ${Math.round(weak.avg)} percent.`);
                    }
                } catch (_) {}

                try {
                    const r = await fetch('/api/profile', { credentials: 'same-origin' });
                    if (r.ok) {
                        const d = await r.json();
                        const completed = d.completed_asanas || {};
                        const total = Object.values(completed).reduce((a, b) => a + (Number(b) || 0), 0);
                        const days = d.total_active_days || (d.activity_log || []).length;
                        const learned = Object.keys(completed).length;
                        parts.push(`Overall: ${total} sessions, ${days} active days, ${learned} poses learned.`);
                    }
                } catch (_) {}

                if (!parts.length) {
                    this.speakCorrection('No sessions yet. Start a pose and I\u2019ll start tracking.', true);
                } else {
                    this.speakCorrection(parts.join(' '), true);
                }
            },

            /**
             * Picks an appropriate pose based on the current hour and
             * starts it — the voice equivalent of the "start today's
             * practice" button.
             */
            recommendPose() {
                const lib = (typeof ASANA_LIBRARY !== 'undefined') ? ASANA_LIBRARY : [];
                if (!lib.length) { this.speakCorrection('The library is still loading.', true); return; }

                // Prefer the user's weakest pose if history exists — that's
                // where practice actually pays off.
                try {
                    if (window.VoiceHistory) {
                        const weak = window.VoiceHistory.weakest();
                        if (weak) {
                            const pose = lib.find(a => a.name === weak.pose);
                            if (pose) {
                                this.speakCorrection(`Try ${pose.sanskrit} — your rolling average there is ${Math.round(weak.avg)} percent. Practice pays off where it's hardest.`, true);
                                this.navigate('ar_correction');
                                setTimeout(() => this.selectAsanaAndStart(pose.name), 600);
                                return;
                            }
                        }
                    }
                } catch (_) {}

                // Otherwise pick by time of day.
                const hour = new Date().getHours();
                let candidates;
                if (hour < 10) candidates = lib.filter(a => a.level === 'Beginner');
                else if (hour < 18) candidates = lib.filter(a => a.level === 'Intermediate' || a.level === 'Beginner');
                else candidates = lib.filter(a => a.name === 'Balasana' || a.name === 'Sukhasana' || a.name === 'Paschimottanasana' || a.name === 'Setu Bandhasana');
                if (!candidates.length) candidates = lib;
                const pick = candidates[Math.floor(Math.random() * candidates.length)];
                this.speakCorrection('Try ' + pick.sanskrit + '. A good fit for right now.', true);
                this.navigate('ar_correction');
                setTimeout(() => this.selectAsanaAndStart(pick.name), 600);
            },

            /**
             * Four-round box breath (4-4-4-4). Spoken cues, no UI needed —
             * voice-only is the whole point for "calm me" / "anxious".
             */
            guidedBreath() {
                if (this._breathTimer) { clearTimeout(this._breathTimer); this._breathTimer = null; }
                const cues = [
                    'Let\u2019s breathe together.',
                    'Inhale, four counts.',
                    'Hold, four counts.',
                    'Exhale, four counts.',
                    'Hold empty, four counts.',
                    'Again. Inhale.',
                    'Hold.',
                    'Exhale.',
                    'Hold.',
                    'One more. Inhale.',
                    'Hold.',
                    'Exhale, all the way.',
                    'Good. Return to natural breath.',
                ];
                let i = 0;
                const step = () => {
                    if (i >= cues.length) { this._breathTimer = null; return; }
                    this.speakCorrection(cues[i++], true);
                    this._breathTimer = setTimeout(step, 4200);
                };
                step();
            },

            /**
             * Start a timed hold with spoken countdown (item 16).
             * Default 30 seconds. Speaks at 20, 10, 5, 3, 2, 1, done.
             *
             * Edge cases handled:
             * - If a timer is already running, stop it first (no stacking).
             * - If no pose is active, warn and bail.
             * - If the user switches poses mid-timer, the timer auto-cancels
             *   (checked via _timedHoldPose mismatch in the tick callback).
             */
            startTimedHold(secs) {
                secs = secs || 30;
                if (!window.PracticeFlow || !window.PracticeFlow.TimedHold) {
                    this.speakCorrection('Timer not available.', true); return;
                }
                if (!this.currentPose) {
                    this.speakCorrection('Pick a pose first, then start the timer.', true); return;
                }
                // Stop any existing timer before starting a new one.
                if (window.PracticeFlow.TimedHold.isRunning()) {
                    window.PracticeFlow.TimedHold.stop();
                }
                this._timedHoldPose = this.currentPose;
                this.speakCorrection({ message: 'Hold for ' + secs + ' seconds. Starting now.', shortMessage: 'Hold ' + secs + 's', priority: 2 }, true);
                const spokenAt = new Set();
                const milestones = [20, 10, 5, 3, 2, 1];
                window.PracticeFlow.TimedHold.start(secs, (remaining) => {
                    // Auto-cancel if the user switched poses mid-timer.
                    if (this.currentPose !== this._timedHoldPose) {
                        window.PracticeFlow.TimedHold.stop();
                        return;
                    }
                    if (milestones.includes(remaining) && !spokenAt.has(remaining)) {
                        spokenAt.add(remaining);
                        if (remaining > 5) this.speakCorrection({ message: remaining + ' seconds.', shortMessage: remaining + '', priority: 3 });
                        else this.speakCorrection({ message: remaining + '.', shortMessage: remaining + '', priority: 2 });
                    }
                }, () => {
                    this.speakCorrection({ message: 'Time. Release the pose.', shortMessage: 'Release', priority: 2 }, true);
                    if (navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch(_){}
                    this._timedHoldPose = null;
                });
            },

            /**
             * Toggle the breath pacing overlay (item 17).
             * Animated circle: inhale 4 s, exhale 4 s.
             *
             * Edge cases handled:
             * - Toggling off while running stops cleanly.
             * - If the AR session stops while breath pacing is on, it
             *   auto-stops (handled in stopARAssessment below).
             */
            toggleBreathPacing() {
                if (!window.PracticeFlow || !window.PracticeFlow.BreathPacing) {
                    this.speakCorrection('Breath pacing not available.', true); return;
                }
                if (window.PracticeFlow.BreathPacing._running) {
                    window.PracticeFlow.BreathPacing.stop();
                    this.speakCorrection('Breath pacing off.', true);
                } else {
                    window.PracticeFlow.BreathPacing.start({ inhale: 4, exhale: 4 });
                    this.speakCorrection('Breath pacing on. Follow the circle.', true);
                }
            },
