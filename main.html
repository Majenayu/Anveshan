            /**
             * Updates the pose score display
             */
            updateScore(score) {
                const scoreElement = document.getElementById('pose-score');
                const scoreBar = document.getElementById('score-bar');

                if (scoreElement && scoreBar) {
                    scoreElement.textContent = Math.round(score);
                    scoreBar.style.width = `${Math.max(0, Math.min(100, score))}%`;

                    // Change color based on score
                    if (score >= 85) {
                        scoreBar.className = 'bg-gradient-to-r from-green-500 to-green-400 h-3 rounded-full transition-all duration-500';
                    } else if (score >= 70) {
                        scoreBar.className = 'bg-gradient-to-r from-primary to-accent h-3 rounded-full transition-all duration-500';
                    } else if (score >= 50) {
                        scoreBar.className = 'bg-gradient-to-r from-yellow-500 to-orange-400 h-3 rounded-full transition-all duration-500';
                    } else {
                        scoreBar.className = 'bg-gradient-to-r from-red-500 to-red-400 h-3 rounded-full transition-all duration-500';
                    }
                }
            },

            /**
             * Calculates the angle formed by three keypoints (A, B, C) where B is the vertex.
             * Returns the angle in degrees.
             */
            calculateAngle(A, B, C) {
                if (!A || !B || !C) return 180; // Return 180 (straight line) if points are missing for lenient check

                const AB = Math.sqrt(Math.pow(B.x - A.x, 2) + Math.pow(B.y - A.y, 2));
                const BC = Math.sqrt(Math.pow(C.x - B.x, 2) + Math.pow(C.y - B.y, 2));
                const AC = Math.sqrt(Math.pow(C.x - A.x, 2) + Math.pow(C.y - A.y, 2));

                if (AB === 0 || BC === 0) return 180;

                // Law of Cosines
                const cosAngle = (Math.pow(AB, 2) + Math.pow(BC, 2) - Math.pow(AC, 2)) / (2 * AB * BC);
                // Clamp the value to the range [-1, 1] to prevent NaN due to floating point inaccuracies
                const clampedCosAngle = Math.max(-1, Math.min(1, cosAngle));

                const angleRad = Math.acos(clampedCosAngle);
                return (angleRad * 180) / Math.PI;
            },

            /**
             * Checks the detected keypoints against the expected form for the current pose.
             * Returns an array of correction messages.
             */
            checkPose(keypoints, poseName) {
                if (typeof PoseEngine === 'undefined') return [];
                const result = PoseEngine.evaluate(keypoints, poseName);
                this._lastPoseScore = result.score;
                // Track session peak for history logging.
                if (typeof result.score === 'number' && result.score > (this._sessionPeakScore || 0)) {
                    this._sessionPeakScore = result.score;
                }
                this._lastDiagnostics = result.diagnostics || [];
                this._lastStance = result.stance || null;
                return result.corrections || [];
            },

            /**
             * Initializes the camera and TensorFlow MoveNet model.
             */
            async startARAssessment() {
                // Camera positioning hint — shown as a brief overlay the
                // first time a user starts AR per session. Uses the pose's
                // view field (front/side) to tell them how to orient the
                // camera. Vanishes after 3 seconds or on tap.
                try {
                    if (!this._cameraHintShown && this.currentPose && typeof ASANA_LIBRARY !== 'undefined') {
                        const asana = ASANA_LIBRARY.find(a => a.name === this.currentPose);
                        const view = (asana && asana.view) || 'front';
                        const hintMsg = view === 'side'
                            ? 'Place the camera to your side, roughly 2 metres away at chest height.'
                            : 'Place the camera in front of you, roughly 2 metres away at chest height.';
                        this._showCameraHint(hintMsg);
                        this._cameraHintShown = true;
                    }
                } catch(_) {}

                const video = document.getElementById('video-feed');
                const canvas = document.getElementById('ar-canvas');
                const ctx = canvas.getContext('2d');
                const statusDiv = document.getElementById('camera-status');
                const statusText = document.getElementById('status-text');
                const errorText = document.getElementById('error-message');
                const feedbackText = document.getElementById('current-feedback-text');

                const updateStatus = (message, isError = false) => {
                    statusText.textContent = message;
                    if (isError) {
                        errorText.textContent = message;
                        errorText.classList.remove('hidden');
                        statusText.classList.add('hidden');
                    } else {
                        errorText.classList.add('hidden');
                        statusText.classList.remove('hidden');
                    }
                    statusDiv.classList.remove('hidden');
                };

                updateStatus("Loading MoveNet model...");

                // Clear any running animation frame before starting a new one
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }

                // Clean up previous video stream if it exists
                if (this.videoStream) {
                    this.videoStream.getTracks().forEach(track => track.stop());
                }


                // 1. Load Model
                if (!this.detector) {
                    try {
                        const model = poseDetection.SupportedModels.MoveNet;
                        const detectorConfig = {
                            // Thunder is ~3x more accurate than Lightning on joint
                            // angles, which is what yoga pose rules rely on. Slower
                            // fps (~10-15 on CPU, ~25 on GPU) is an acceptable trade.
                            modelType: poseDetection.movenet.modelType.SINGLEPOSE_THUNDER,
                            enableSmoothing: true,
                            minPoseScore: 0.3,
                        };
                        this.detector = await poseDetection.createDetector(model, detectorConfig);
                        updateStatus("Model loaded. Requesting camera access...");
                    } catch (e) {
                        updateStatus(`Failed to load MoveNet model: ${e.message}`, true);
                        console.error(e);
                        return;
                    }
                }

                // 2. Get Camera Stream (ask for decent resolution so keypoints are precise)
                navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user',
                    },
                })
                    .then((stream) => {
                        this.videoStream = stream;
                        video.srcObject = stream;
                        video.onloadedmetadata = () => {
                            video.play();

                            // The canvas internal resolution must match the VIDEO pixel
                            // dimensions (what MoveNet sees), not the CSS display size.
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;

                            // Show video container
                            const videoContainer = document.getElementById('video-container');
                            const feedbackArea = document.getElementById('feedback-area');

                            if (videoContainer) videoContainer.style.display = 'block';
                            if (statusDiv) statusDiv.classList.add('hidden');
                            if (feedbackArea) feedbackArea.style.display = 'block';
                            if (feedbackText) feedbackText.textContent = `Starting ${this.currentPose} analysis... Stand in position!`;

                            // Start the ML loop, passing video reference
                            this.poseDetectionFrame(video, ctx, this.detector, feedbackText);
                        };
                    })
                    .catch((err) => {
                        console.error("Camera access error:", err);
                        updateStatus("Permission denied or camera is in use. Please enable camera access.", true);
                    });
            },

            /**
             * Main loop for MoveNet pose detection and drawing.
             */
            async poseDetectionFrame(video, ctx, detector, feedbackText) {
                // Request next frame first to allow browser to manage repaint speed
                this.animationFrameId = requestAnimationFrame(() => this.poseDetectionFrame(video, ctx, detector, feedbackText));

                if (detector && video.readyState === 4) {
                    const poses = await detector.estimatePoses(video);

                    // Clear the canvas
                    ctx.clearRect(0, 0, video.videoWidth, video.videoHeight);

                    if (poses.length > 0) {
                        const pose = poses[0];
                        const keypoints = pose.keypoints;

                        // 1. Correction Logic - Get corrections with affected parts
                        let affectedKeypoints = new Set(); // Track all affected keypoints for coloring
                        let corrections = [];

                        if (this.currentPose) {
                            corrections = this.checkPose(keypoints, this.currentPose.split('(')[0].trim());

                            // Aggregate affected keypoints for drawing
                            corrections.forEach(c => {
                                if (c.affected) {
                                    c.affected.forEach(kpName => affectedKeypoints.add(kpName));
                                }
                            });

                            // === STABILIZED SUGGESTIONS ===
                            // Only update suggestion every BUFFER_SIZE frames
                            correctionCounter++;

                            if (correctionCounter >= BUFFER_SIZE) {
                                // Time to update the suggestion
                                stableSuggestion = corrections.length > 0 ? corrections[0] : { message: "Great! Hold this pose.", color: 'green' };
                                correctionCounter = 0; // Reset counter
                            }

                            // Use stable suggestion for display
                            const displayCorrection = stableSuggestion || corrections[0] || { message: "Analyzing pose...", color: 'gray' };

                            // Display stabilized feedback message
                            feedbackText.textContent = displayCorrection.message;

                            // Update feedback color based on stabilized suggestion
                            if (displayCorrection.color === 'red') {
                                feedbackText.classList.remove('text-green-400', 'text-yellow-400', 'text-gray-400');
                                feedbackText.classList.add('text-red-400');
                            } else if (displayCorrection.color === 'yellow') {
                                feedbackText.classList.remove('text-green-400', 'text-red-400', 'text-gray-400');
                                feedbackText.classList.add('text-yellow-400');
                            } else if (displayCorrection.color === 'green') {
                                feedbackText.classList.remove('text-red-400', 'text-yellow-400', 'text-gray-400');
                                feedbackText.classList.add('text-green-400');
                            } else {
                                feedbackText.classList.remove('text-red-400', 'text-yellow-400', 'text-green-400');
                                feedbackText.classList.add('text-gray-400');
                            }

                            // === SCORING SYSTEM ===
                            // Score comes from PoseEngine's weighted rule pass ratio.
                            let frameScore = this._lastPoseScore != null ? this._lastPoseScore : 100;

                            // Keep score between 0-100
                            frameScore = Math.max(0, Math.min(100, frameScore));

                            // Add to score history and calculate average
                            scoreHistory.push(frameScore);
                            if (scoreHistory.length > 30) { // Keep last 30 frames (about 1 second)
                                scoreHistory.shift();
                            }

                            // Calculate average score for smoother display
                            poseScore = scoreHistory.reduce((a, b) => a + b, 0) / scoreHistory.length;

                            // Update score display
                            this.updateScore(poseScore);

                            // === COURSE PROGRESS TRACKING ===
                            app.checkCourseProgress(poseScore);

                            // === MILESTONE TRACKING ===
                            // Track high accuracy for milestone rewards
                            if (poseScore >= 70 && milestonesEarned < 2) {
                                highAccuracyTimer++;

                                // 10 seconds at ~30fps = 300 frames
                                if (highAccuracyTimer >= 300 && Date.now() - lastMilestoneTime > 1000) {
                                    milestonesEarned++;
                                    localStorage.setItem('milestonesEarned', milestonesEarned.toString());
                                    lastMilestoneTime = Date.now();
                                    highAccuracyTimer = 0;

                                    // Show celebration message
                                    feedbackText.textContent = `🎉 Milestone ${milestonesEarned} Earned! Great job!`;
                                    feedbackText.classList.remove('text-red-400', 'text-yellow-400', 'text-gray-400');
                                    feedbackText.classList.add('text-green-400');

                                    console.log(`Milestone ${milestonesEarned} achieved!`);
                                }
                            } else {
                                // Reset timer if accuracy drops below 70%
                                highAccuracyTimer = 0;
                            }

                            // Update the correction log every ~30 frames (~1s) so users see
                            // responsive feedback. Voice speaks only when the top cue changes
                            // and the throttle in speakCorrection prevents repetition spam.
                            if (correctionCounter % 30 === 0) {
                                this.logCorrections(corrections);
                            }
                            if (this.ttsEnabled && corrections.length > 0) {
                                // Pick the top 1-2 cues by priority so we
                                // coach multiple issues in sequence without
                                // chatter. Skip priority 0 (meta) cues.
                                const nonMeta = corrections.filter(c => c.priority !== 0);
                                const queue = nonMeta.slice(0, 2);
                                if (!queue.length && corrections[0]) queue.push(corrections[0]);

                                // Personalise each cue for THIS asana.
                                const spoken = queue.map(c => (window.PoseCues && window.PoseCues.personalise)
                                    ? window.PoseCues.personalise(c, this.currentPose)
                                    : c);

                                // Speak the top cue now; if a second distinct
                                // cue exists, queue it for after the first ends.
                                if (spoken[0]) this.speakCorrection(spoken[0]);
                                if (spoken[1] && spoken[0] && spoken[1].message !== spoken[0].message) {
                                    this._queuedCorrection = spoken[1];
                                } else {
                                    this._queuedCorrection = null;
                                }

                                // Haptic feedback on priority 1 (mobile only).
                                if (spoken[0] && spoken[0].priority === 1 && navigator.vibrate) {
                                    try { navigator.vibrate([80, 40, 80]); } catch(_){}
                                }

                                // Track chronic rule failures for per-user calibration.
                                try {
                                    if (window.PracticeFlow && window.PracticeFlow.RuleFocus) {
                                        for (const s of spoken) if (s.id) window.PracticeFlow.RuleFocus.bump(s.id);
                                    }
                                } catch(_){}

                                // Visual pulse — zero latency "something is off here"
                                for (const s of spoken) this._pulseAffectedJoints(s.affected, s.priority);
                            } else if (this.ttsEnabled && this.currentPose && window.PoseCues) {
                                // No corrections → pose is held well. Occasionally
                                // speak a pose-specific "holding" cue to keep the
                                // practice engaged without spamming.
                                const HOLD_GAP_MS = 12000;
                                const now = Date.now();
                                if ((now - (this._lastHoldingCueAt || 0)) > HOLD_GAP_MS) {
                                    const hold = window.PoseCues.holding(this.currentPose);
                                    if (hold) {
                                        this.speakCorrection({ message: hold, shortMessage: hold, priority: 3 });
                                        this._lastHoldingCueAt = now;
                                    }
                                }
                                this._clearPulse();
                            } else {
                                this._clearPulse();
                            }

                        } else {
                            feedbackText.textContent = "Select a pose to begin tracking!";
                        }

                        // 2. Drawing Logic
                        this.drawKeypoints(video, keypoints, ctx, affectedKeypoints, corrections);
                        this.drawSkeleton(video, keypoints, ctx, affectedKeypoints, corrections);

                        // 3. Draw Score on Canvas (Fix mirrored text)
                        if (this.currentPose) {
                            // Save the current canvas state
                            ctx.save();

                            // Flip horizontally to un-mirror the text
                            ctx.scale(-1, 1);

                            ctx.font = 'bold 48px Inter, sans-serif';
                            ctx.textAlign = 'left';
                            ctx.textBaseline = 'top';

                            // Add shadow for better visibility
                            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                            ctx.shadowBlur = 10;
                            ctx.shadowOffsetX = 2;
                            ctx.shadowOffsetY = 2;

                            // Color based on score
                            if (poseScore >= 85) {
                                ctx.fillStyle = '#10B981'; // Green
                            } else if (poseScore >= 70) {
                                ctx.fillStyle = '#FFEB3B'; // Yellow/Gold
                            } else {
                                ctx.fillStyle = '#EF4444'; // Red
                            }

                            // Draw score (negative x because canvas is flipped)
                            ctx.fillText(Math.round(poseScore), -video.videoWidth + 20, 20);

                            // Restore the canvas state
                            ctx.restore();
                        }

                    } else {
                        // No pose detected
                        feedbackText.textContent = this.currentPose ? `No person detected. Stand further back or adjust lighting.` : 'Select a pose to begin tracking!';
                    }
                }
            },

            /**
             * Logs corrections to the correction log panel with real-time diagnostics.
             * Shows the most recent corrections plus (if diagnostic mode is on) live
             * pass/fail state for every rule.
             */
            logCorrections(corrections) {
                if (!this.correctionHistory) this.correctionHistory = [];

                const correctionLog = document.getElementById('correction-log');
                if (!correctionLog) return;

                // Maintain a de-duplicated rolling list of the last 5 distinct cues.
                corrections.forEach(corr => {
                    const txt = corr.message;
                    const last = this.correctionHistory[this.correctionHistory.length - 1];
                    if (!last || last.message !== txt) {
                        this.correctionHistory.push({ message: txt, color: corr.color, at: Date.now() });
                        if (this.correctionHistory.length > 5) this.correctionHistory.shift();
                    }
                });

                // Render log (corrections with color-coded dots)
                const dotColor = (c) => c === 'red' ? '#C2552F' : c === 'yellow' ? '#E0A23F' : c === 'green' ? '#6FA089' : '#A8A294';
                const logHTML = `
                    <span class="kicker" style="color:#6FA089; display:block; margin-bottom:8px">Correction log</span>
                    ${this.correctionHistory.slice().reverse().map(h => `
                        <div class="flex items-center" style="gap:8px; margin-bottom:6px">
                            <span style="width:7px; height:7px; border-radius:999px; background:${dotColor(h.color)}; flex-shrink:0"></span>
                            <span style="font-size:12px; color:#F5F2EB; line-height:1.5">${h.message}</span>
                        </div>
                    `).join('')}
                `;

                // Render diagnostics panel (live rule check-list)
                const diag = this._lastDiagnostics || [];
                let diagHTML = '';
                if (diag.length && this._diagnosticsVisible) {
                    diagHTML = `
                        <div style="border-top:1px solid #1F5A44; margin-top:10px; padding-top:10px">
                            <span class="kicker" style="color:#6FA089; display:block; margin-bottom:8px">Live rule check (${diag.filter(d => d.pass).length}/${diag.length} passing)</span>
                            ${diag.map(d => {
                                if (d.skipped) return '';
                                const dot = d.pass ? '#6FA089' : (d.reported ? '#C2552F' : '#E0A23F');
                                return `
                                    <div class="flex items-center" style="gap:8px; margin-bottom:4px; font-size:11px">
                                        <span style="width:6px; height:6px; border-radius:999px; background:${dot}; flex-shrink:0"></span>
                                        <span style="color:#C7DBCE; flex:1">${d.message}</span>
                                        <span style="color:#6FA089">${d.measured !== undefined ? d.measured : ''}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                }

                correctionLog.innerHTML = logHTML + diagHTML;
            },

            /**
             * Toggles the diagnostic rule panel (user-facing debug panel).
             * Users can tap the score bubble to turn it on/off.
             */
            toggleDiagnostics() {
                this._diagnosticsVisible = !this._diagnosticsVisible;
                this.logCorrections([]);
            },

            /**
             * Draws circles on the keypoints detected by MoveNet with enhanced color coding for Tadasana.
             */
            /**
             * Mark a set of keypoint names as "pulsing" for the next ~1.2 s
             * so the skeleton renderer draws a bright animated ring around
             * them. Gives zero-latency visual feedback the instant a
             * correction fires — even before TTS gets to it.
             */
            _pulseAffectedJoints(affected, priority) {
                if (!affected || !affected.length) return;
                const durationMs = priority === 1 ? 1600 : 1200;
                const until = Date.now() + durationMs;
                this._pulseState = this._pulseState || {};
                for (const name of affected) {
                    this._pulseState[name] = { until, priority: priority || 3 };
                }
            },
            _clearPulse() {
                // Let the TTL on each entry expire naturally so the ring
                // fades on its own — no hard clear needed.
            },

             * Auto-dismisses after 3 seconds or on tap. Uses the same
             * overlay style as showReferenceOverlay but smaller.

                    'opacity:0', 'transition:opacity 0.25s ease', 'cursor:pointer',

            drawKeypoints(video, keypoints, ctx, affectedKeypoints, corrections) {
                if (!keypoints || !ctx) return;
                affectedKeypoints = affectedKeypoints || new Set();
                corrections = corrections || [];

                keypoints.forEach((keypoint, index) => {
                    if (keypoint.score > MIN_CONFIDENCE) {
                        // Use coordinates directly since canvas is mirrored via CSS
                        const x = keypoint.x;
                        const y = keypoint.y;

                        // Enhanced color determination for Tadasana
                        let fillColor = '#42A5F5'; // Default blue
                        let strokeColor = '#FFFFFF'; // Default white border
                        let radius = 5; // Default radius
                        
                        const keypointName = Object.keys(keypointIndices).find(name => keypointIndices[name] === index);

                        if (keypointName && affectedKeypoints.has(keypointName)) {
                            // Check correction severity and type
                            const corr = corrections.find(c => c.affected && c.affected.includes(keypointName));
                            if (corr) {
                                if (corr.color === 'red') {
                                    // Critical errors - larger, pulsing red
                                    fillColor = '#EF4444';
                                    strokeColor = '#FCA5A5';
                                    radius = 7;
                                    
                                    // Add pulsing effect for critical errors
                                    const pulseIntensity = Math.sin(Date.now() * 0.01) * 0.3 + 0.7;
                                    ctx.globalAlpha = pulseIntensity;
                                } else if (corr.color === 'yellow') {
                                    // Minor warnings - amber/orange
                                    fillColor = '#F59E0B';
                                    strokeColor = '#FCD34D';
                                    radius = 6;
                                } else if (corr.color === 'green') {
                                    // Perfect alignment - bright green with glow
                                    fillColor = '#10B981';
                                    strokeColor = '#6EE7B7';
                                    radius = 6;
                                    
                                    // Add subtle glow for perfect points
                                    ctx.shadowColor = '#10B981';
                                    ctx.shadowBlur = 10;
                                }
                            }
                        } else if (keypoint.score > 0.8) {
                            // High confidence points - bright white
                            fillColor = '#FFFFFF';
                            strokeColor = '#E5E7EB';
                        } else if (keypoint.score > 0.6) {
                            // Medium confidence - light blue
                            fillColor = '#60A5FA';
                            strokeColor = '#DBEAFE';
                        }

                        // Draw the keypoint
                        ctx.beginPath();
                        ctx.arc(x, y, radius, 0, 2 * Math.PI);
                        ctx.fillStyle = fillColor;
                        ctx.fill();

                        // Add border for contrast
                        ctx.strokeStyle = strokeColor;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        
                        // Reset effects
                        ctx.globalAlpha = 1.0;
                        ctx.shadowBlur = 0;
                        
                        // Add keypoint labels for critical points in Tadasana
                        if (this.currentPose && this.currentPose.includes('Tadasana') && 
                            ['left_ankle', 'right_ankle', 'left_hip', 'right_hip', 'left_shoulder', 'right_shoulder', 'nose'].includes(keypointName)) {
                            
                            ctx.font = '10px Inter, sans-serif';
                            ctx.fillStyle = '#FFFFFF';
                            ctx.textAlign = 'center';
                            ctx.fillText(keypointName.split('_')[1] || keypointName, x, y - radius - 5);
                        }

                        // ── Real-time pulse ring — zero-latency visual cue ──
                        // If this joint is currently flagged by a correction,
                        // draw an expanding ring. Priority 1 = red ring, 2 = amber.
                        const pulse = this._pulseState && this._pulseState[keypointName];
                        if (pulse && pulse.until > Date.now()) {
                            const remaining = pulse.until - Date.now();
                            const total = pulse.priority === 1 ? 1600 : 1200;
                            const t = 1 - (remaining / total); // 0 → 1 over the pulse lifetime
                            const ringRadius = radius + 10 + (t * 30);
                            const alpha = 1 - t;
                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(x, y, ringRadius, 0, 2 * Math.PI);
                            ctx.strokeStyle = pulse.priority === 1
                                ? `rgba(194, 85, 47, ${alpha})`       // terracotta for safety
                                : `rgba(224, 162, 63, ${alpha})`;      // saffron for form
                            ctx.lineWidth = pulse.priority === 1 ? 4 : 3;
                            ctx.stroke();
                            ctx.restore();
                        }
                    }
                });
            },

            /**
             * Draws lines connecting the keypoints detected by MoveNet with color coding.
             */
            drawSkeleton(video, keypoints, ctx, affectedKeypoints, corrections) {
                if (!keypoints || !ctx) return;
                affectedKeypoints = affectedKeypoints || new Set();
                corrections = corrections || [];

                ctx.lineWidth = 3;

                SKELETON_CONNECTIONS.forEach(([i, j]) => {
                    const kp1 = keypoints[i];
                    const kp2 = keypoints[j];

                    if (kp1 && kp2 && kp1.score > MIN_CONFIDENCE && kp2.score > MIN_CONFIDENCE) {

                        const kp1Name = Object.keys(keypointIndices).find(name => keypointIndices[name] === i);
                        const kp2Name = Object.keys(keypointIndices).find(name => keypointIndices[name] === j);

                        let lineColor = '#1E88E5'; // Default line color (Secondary Blue)
                        let corrColor = null;

                        // Check if either keypoint in the connection is part of a severe correction (red or yellow)
                        if (affectedKeypoints.has(kp1Name) || affectedKeypoints.has(kp2Name)) {
                            const relevantCorrections = corrections.filter(c =>
                                c.affected && (c.affected.includes(kp1Name) || c.affected.includes(kp2Name))
                            );

                            // Prioritize the worst color (red > yellow > green)
                            if (relevantCorrections.some(c => c.color === 'red')) {
                                corrColor = 'red';
                            } else if (relevantCorrections.some(c => c.color === 'yellow')) {
                                corrColor = 'yellow';
                            } else if (relevantCorrections.some(c => c.color === 'green')) {
                                corrColor = 'green';
                            }
                        }

                        if (corrColor === 'red') {
                            lineColor = '#EF4444'; // Red
                        } else if (corrColor === 'yellow') {
                            lineColor = '#F59E0B'; // Yellow
                        } else if (corrColor === 'green') {
                            lineColor = '#10B981'; // Green
                        }

                        // Use coordinates directly since canvas is mirrored via CSS
                        const p1x = kp1.x;
                        const p1y = kp1.y;
                        const p2x = kp2.x;
                        const p2y = kp2.y;

                        // Gradient bone: confidence-weighted at each end so
                        // partially-visible limbs fade out rather than strobe.
                        // Colour falls back to solid lineColor when not in a correction.
                        const grad = ctx.createLinearGradient(p1x, p1y, p2x, p2y);
                        const c1 = Math.min(1, kp1.score);
                        const c2 = Math.min(1, kp2.score);
                        grad.addColorStop(0, hexWithAlpha(lineColor, c1));
                        grad.addColorStop(1, hexWithAlpha(lineColor, c2));
                        ctx.strokeStyle = grad;
                        ctx.beginPath();
                        ctx.moveTo(p1x, p1y);
                        ctx.lineTo(p2x, p2y);
                        ctx.stroke();
                    }
                });
            },

            /**
             * Stops the AR session and frees resources.
             */
            stopARAssessment() {
                // Speak a pose-specific farewell line — each asana has its own.
                try {
                    if (this.currentPose && window.PoseCues && this.ttsEnabled) {
                        const exitLine = window.PoseCues.exit(this.currentPose);
                        if (exitLine) this.speakCorrection({ message: exitLine, shortMessage: exitLine, priority: 3 }, true);
                    }
                } catch (_) {}

                // ── Edge-case cleanup: stop any running timer or breath overlay ──
                try {
                    if (window.PracticeFlow) {
                        if (window.PracticeFlow.TimedHold && window.PracticeFlow.TimedHold.isRunning()) {
                            window.PracticeFlow.TimedHold.stop();
                        }
                        if (window.PracticeFlow.BreathPacing && window.PracticeFlow.BreathPacing._running) {
                            window.PracticeFlow.BreathPacing.stop();
                        }
                    }
                } catch (_) {}

                // Log session history BEFORE clearing state so the
                // offline assistant can answer "how was my last session".
                try {
                    if (window.VoiceHistory && this.currentPose && this._sessionStartTs) {
                        const durationS = (Date.now() - this._sessionStartTs) / 1000;
                        const peak = Math.max(0, Math.min(100, this._sessionPeakScore || this._lastPoseScore || 0));
                        if (durationS >= 5) { // ignore accidental taps
                            const a = (typeof ASANA_LIBRARY !== 'undefined') ? ASANA_LIBRARY.find(x => x.name === this.currentPose) : null;
                            const record = {
                                pose: this.currentPose,
                                poseSanskrit: a ? a.sanskrit : null,
                                peakScore: peak,
                                durationS,
                                ts: Date.now(),
                            };
                            window.VoiceHistory.logSession(record);

                            // Post-session recap card — item 25.
                            if (window.PracticeFlow && window.PracticeFlow.SessionRecap) {
                                window.PracticeFlow.SessionRecap.show(record);
                            }
                        }
                    }
                } catch (e) { console.warn('history log failed', e); }
                this._sessionStartTs = null;
                this._sessionPeakScore = 0;

                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }
                if (this.videoStream) {
                    this.videoStream.getTracks().forEach(track => track.stop());
                    this.videoStream = null;
                }
                // Hide the video container and show selection again
                const videoContainer = document.getElementById('video-container');
                const poseSelection = document.getElementById('pose-selection');
                const arSession = document.getElementById('ar-session');
                const feedbackArea = document.getElementById('feedback-area');
                const referenceContainer = document.getElementById('reference-container');

                if (videoContainer) videoContainer.style.display = 'none';
                if (poseSelection) poseSelection.style.display = 'grid';
                if (arSession) arSession.style.display = 'block';
                if (feedbackArea) feedbackArea.style.display = 'none';
                if (referenceContainer) referenceContainer.style.display = 'none';

                this.currentPose = null;
                this.correctionHistory = [];
                console.log("AR assessment stopped.");
            },

            renderDashboard() {

                const first = (userName || 'friend').trim().split(/\s+/)[0];

                const tod = hour < 5 ? 'Night' : hour < 12 ? 'Morning' : hour < 17 ? 'Afternoon' : hour < 21 ? 'Evening' : 'Night';
                const greeting = tod === 'Morning' ? 'Good morning' : tod === 'Afternoon' ? 'Good afternoon' : tod === 'Evening' ? 'Good evening' : 'Welcome back';
                const dayName = new Date().toLocaleDateString('en-US', { weekday: 'long' });
                const timeStr = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });

                const todaysPose = (this.courseProgress?.poses || []).find(p => !p.completed && !p.locked);

                const todayAsana = asanaData.find(a => a.name === todayName) || asanaData[0];

                const completedAsanas = this.userData?.completed_asanas || {};
                const totalSessions = Object.values(completedAsanas).reduce((a,b)=>a+(Number(b)||0),0);
                const activeDays = this.userData?.total_active_days || 0;
                const meanAccuracy = (function(){

                    const withAcc = poses.filter(p => p.bestAccuracy > 0);
                    if (!withAcc.length) return '—';
                    return Math.round(withAcc.reduce((a,p)=>a+p.bestAccuracy,0) / withAcc.length) + '%';
                }).call(this);
                const level = activeDays >= 60 ? 'III' : activeDays >= 14 ? 'II' : 'I';

                const continueList = (this.courseProgress?.poses || []).slice(0, 3);

                return `
                <div class="view-fade-in">

            showAsanaDetails(asanaName) {
                const asana = asanaData.find(a => a.name === asanaName);
                if (!asana) return;

                const backdrop = document.getElementById('asana-modal-backdrop');
                const name = document.getElementById('modal-asana-name');
                const sanskrit = document.getElementById('modal-asana-sanskrit');
                const benefits = document.getElementById('modal-asana-benefits');
                const precaution = document.getElementById('modal-asana-precaution');
                const steps = document.getElementById('modal-asana-steps');
                const category = document.getElementById('modal-asana-category');
                const targeted = document.getElementById('modal-asana-targeted');
                const startBtn = document.getElementById('modal-start-btn');

                name.textContent = asana.name;
                sanskrit.textContent = asana.sanskrit;
                benefits.textContent = asana.benefits;
                precaution.textContent = asana.precaution;
                category.textContent = asana.category;
                targeted.textContent = asana.targeted;

                category.className = `inline-flex px-3 py-1 text-[11px] rounded-full font-semibold ${asana.category === 'Beginner' ? 'bg-forest-900 text-cream' : asana.category === 'Intermediate' ? 'bg-terracotta-600 text-cream' : 'bg-ink-900 text-saffron-500'}`;

                // Update kicker category label
                const kicker = document.getElementById('modal-asana-category-kicker');
                if (kicker) kicker.textContent = asana.category;

                // View badge + real pose photo
                const viewBadge = document.getElementById('modal-view-badge');
                if (viewBadge) viewBadge.textContent = ((asana.view || 'front') + ' VIEW').toUpperCase();
                const silhouette = document.getElementById('modal-asana-silhouette');
                if (silhouette) {
                    if (asana.imagePath) {
                        silhouette.src = asana.imagePath;
                        silhouette.alt = asana.name + ' reference';
                    } else if (typeof PoseImage !== 'undefined' && asana.referenceKeypoints) {
                        silhouette.src = PoseImage.dataUri(asana, { bg: '#EEE9DE', body: '#0F3D2E', joint: '#E0A23F', width: 520, height: 640 });
                        silhouette.alt = asana.name + ' silhouette';
                    }
                }

                steps.innerHTML = asana.steps.map((step, idx) => `
                    <li class="flex items-center" style="background:#EEE9DE; border-radius:12px; padding:10px 14px; gap:14px">
                        <span class="kicker" style="color:#C2552F">${String(idx + 1).padStart(2, '0')}</span>
                        <span style="font-size:15px; color:#14120E; line-height:1.55">${step}</span>
                    </li>
                `).join('');

                startBtn.onclick = () => {
                    this.closeAsanaDetails();
                    this.selectAsanaAndStart(asana.name);
                };

                backdrop.classList.add('active');
                document.body.style.overflow = 'hidden'; // Prevent scroll
            },

            closeAsanaDetails() {
                const backdrop = document.getElementById('asana-modal-backdrop');
                backdrop.classList.remove('active');
                document.body.style.overflow = ''; // Restore scroll
            },

            startCourseTest(poseName) {
                const poseProgress = this.courseProgress.poses.find(p => p.name === poseName);
                if (!poseProgress || poseProgress.attemptsRemaining <= 0) {
                    alert("No attempts remaining for this pose.");
                    return;
                }

                // Request fullscreen for focus
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.warn(`Error attempting to enable full-screen mode: ${err.message}`);
                    });
                }

                this.courseMode = true;
                this.testActive = false; // Phase 1: Waiting for initial match
                this.currentPose = poseName;
                this.courseTimer = 0;
                this.courseHoldTime = 0;
                this.courseStartTime = Date.now();

                this.ttsEnabled = false;

                this.navigate('ar_correction');

                setTimeout(() => {
                    this.startARAssessment();

                    this.courseTimerInterval = setInterval(() => {
                        if (!this.testActive) return; // Don't start 60s timer until test is active

                        this.courseTimer++;
                        const timeLeft = 60 - this.courseTimer;

                        const timerEl = document.getElementById('course-timer-display');
                        if (timerEl) {
                            timerEl.textContent = `Time Left: ${timeLeft}s`;
                        }

                        if (this.courseTimer >= 60) {
                            this.endCourseTest(false, 'Time limit of 60s exceeded');
                        }
                    }, 1000);

                    const feedbackText = document.getElementById('current-feedback-text');
                    if (feedbackText) {
                        feedbackText.textContent = `WAITING FOR INITIAL MATCH: Match ${poseName} at 90% accuracy to start the 60s test timer.`;
                    }
                }, 500);
            },

            checkCourseProgress(currentScore) {
                if (!this.courseMode) return;

                const feedbackText = document.getElementById('current-feedback-text');
                const holdEl = document.getElementById('course-hold-display');

                // PHASE 1: Waiting for initial match
                if (!this.testActive) {
                    if (currentScore >= 90) {
                        this.testActive = true;
                        this.courseTimer = 0; // Reset timer to 0 for the 60s test
                        if (feedbackText) feedbackText.textContent = "TEST STARTED! Hold for 10s. Do not drop below 90%!";
                        if (feedbackText) feedbackText.classList.replace('text-gray-400', 'text-primary');
                    }
                    return;
                }

                // PHASE 2: Test is active, 60s timer is running
                if (currentScore >= 90) {
                    if (!this.courseHoldTimer) {
                        this.courseHoldTimer = Date.now();
                    }

                    const holdDuration = (Date.now() - this.courseHoldTimer) / 1000;

                    if (holdEl) {
                        holdEl.textContent = `${Math.floor(holdDuration)}s / 10s`;
                    }

                    if (holdDuration >= 10) {
                        this.endCourseTest(true, 'Pose Mastered! High Accuracy held for 10s.');
                    }
                } else {
                    // STRICTURE: Any drop below 90% resets the 10s hold timer immediately
                    this.courseHoldTimer = null;
                    if (holdEl) {
                        holdEl.textContent = '0s / 10s';
                    }
                    if (feedbackText && this.testActive) {
                        feedbackText.textContent = "ACCURACY DROPPED! Hold progress reset. Get back above 90%!";
                    }
                }
            },

            endCourseTest(success, message) {
                if (this.courseTimerInterval) {
                    clearInterval(this.courseTimerInterval);
                    this.courseTimerInterval = null;
                }

                // Exit fullscreen
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(err => console.warn(err));
                }

                const poseProgress = this.courseProgress.poses.find(p => p.name === this.currentPose);

                if (!success && this.courseMode && poseProgress) {
                    poseProgress.attemptsRemaining--;
                    localStorage.setItem('courseProgress', JSON.stringify(this.courseProgress));
                }

                this.courseMode = false;
                this.testActive = false;
                this.courseHoldTimer = null;

                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }

                if (this.videoStream) {
                    this.videoStream.getTracks().forEach(track => track.stop());
                }

                if (success) {
                    // EXISTING LOCAL UPDATE
                    const poseIdx = this.courseProgress.poses.findIndex(p => p.name === this.currentPose);
                    if (poseIdx !== -1) {
                        this.courseProgress.poses[poseIdx].completed = true;
                        this.courseProgress.poses[poseIdx].timeHeld = Math.max(this.courseProgress.poses[poseIdx].timeHeld, 10);
                        this.courseProgress.poses[poseIdx].bestAccuracy = Math.max(this.courseProgress.poses[poseIdx].bestAccuracy, poseScore);  // Assume poseScore is in scope or pass it

                        if (poseIdx + 1 < this.courseProgress.poses.length) {
                            this.courseProgress.poses[poseIdx + 1].locked = false;
                        }

                        const allCompleted = this.courseProgress.poses.every(p => p.completed);
                        if (allCompleted) {
                            this.courseProgress.certificateEarned = true;
                        }

                        localStorage.setItem('courseProgress', JSON.stringify(this.courseProgress));
                    }

                    // NEW: Sync to Backend (use this.currentPose, estimate accuracy/time)
                    fetch('/api/complete_pose', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            pose_name: this.currentPose,  // e.g., 'Tadasana'
                            accuracy: 95,  // Or use actual from detection (e.g., currentScore)
                            time_held: 10  // Min successful hold
                        })
                    }).then(res => res.json()).then(data => {
                        console.log('DB Update:', data);  // DEBUG: Check Network tab
                        if (data.success) {
                            alert(`${data.message} Logged to profile!`);  // Optional feedback
                        } else {
                            console.error('DB sync failed:', data);
                        }
                    }).catch(err => console.error('API error:', err));
                }

                alert(message);
                this.navigate('course');
            },

            // --- Initialization ---
            async init() {
                console.log("SUNDAY App Initializing...");

                if (!this.currentView) this.currentView = 'dashboard';

                // Fetch user data for dashboard personalization
                try {
                    const res = await fetch('/api/profile', { credentials: 'same-origin' });
                    if (res.ok) {
                        this.userData = await res.json();
                        window.__user_name = this.userData.name || '';
                        // Update avatar initial
                        const av = document.getElementById('avatar-btn');
                        if (av && this.userData.name) av.textContent = (this.userData.name || 'A').trim().charAt(0).toUpperCase();
                    }
                } catch (e) {
                    console.warn('profile fetch failed', e);
                }

                this.renderNav();
                this.renderContent();
                this.setupVoiceCommands();
                // Restore mic state if it was on before the last navigation
                this.resumeVoiceIfWasOn();

                setTimeout(() => this.updateMilestoneUI(), 100);

                // ── Service Worker registration (item 36) ──
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('/sw.js').then(
                        () => console.log('SW registered'),
                        (e) => console.warn('SW registration failed:', e)
                    );
                }

                // ── Global error boundary (item 38) ──
                window.addEventListener('error', (e) => {
                    console.error('Uncaught error:', e.message, e.filename, e.lineno);
                    this._showErrorBanner(e.message);
                });
                window.addEventListener('unhandledrejection', (e) => {
                    console.error('Unhandled rejection:', e.reason);
                    this._showErrorBanner(String(e.reason).slice(0, 100));
                });

                // ── Accessibility: font size preference (item 34) ──
                try {
                    const savedSize = localStorage.getItem('sunday_font_size');
                    if (savedSize) document.documentElement.style.fontSize = savedSize;
                } catch(_){}

                // ── Analytics stub (item 42) ──
                this._analytics = [];
                this._logEvent = (name, data) => {
                    this._analytics.push({ name, data, ts: Date.now() });
                    if (this._analytics.length > 200) this._analytics.shift();
                };
                this._logEvent('app_init', { view: this.currentView });

                // ── Sync localStorage history to MongoDB (item 37) ──
                // Runs once on init, non-blocking. Ensures history survives
                // browser clears.
                try {
                    const hist = JSON.parse(localStorage.getItem('sunday_voice_history') || '[]');
                    if (hist.length > 0) {
                        fetch('/api/sync-history', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'same-origin',
                            body: JSON.stringify({ sessions: hist }),
                        }).catch(() => {});
                    }
                } catch(_){}
            },

            /** Error boundary banner — shows a non-blocking toast on crash. */
            _showErrorBanner(msg) {
                const existing = document.getElementById('error-banner');
                if (existing) existing.remove();
                const el = document.createElement('div');
                el.id = 'error-banner';
                el.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:200;background:#C2552F;color:#F5F2EB;padding:12px 24px;border-radius:12px;font-size:13px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,0.3);cursor:pointer';
                el.textContent = 'Something went wrong. Tap to dismiss. (' + (msg || 'unknown') + ')';
                el.onclick = () => el.remove();
                document.body.appendChild(el);
                setTimeout(() => { if (el.parentNode) el.remove(); }, 8000);
            },

            /** Accessibility: cycle font size (item 34). */
            cycleFontSize() {
                const sizes = ['16px', '18px', '20px', '22px'];
                const current = document.documentElement.style.fontSize || '16px';
                const idx = sizes.indexOf(current);
                const next = sizes[(idx + 1) % sizes.length];
                document.documentElement.style.fontSize = next;
                try { localStorage.setItem('sunday_font_size', next); } catch(_){}
                this.speakCorrection('Text size: ' + next, true);
            },

            async handleChatSubmit() {

            downloadCertificate() {
                const canvas = document.createElement('canvas');
                canvas.width = 800;
                canvas.height = 600;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#1E1E1E';
                ctx.fillRect(0, 0, 800, 600);

                ctx.strokeStyle = '#42A5F5';
                ctx.lineWidth = 10;
                ctx.strokeRect(20, 20, 760, 560);

                ctx.fillStyle = '#42A5F5';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('SUNDAY Yoga Certification', 400, 100);

                ctx.fillStyle = '#E0E0E0';
                ctx.font = '24px Arial';
                ctx.fillText('This certifies that', 400, 200);

                ctx.font = 'bold 36px Arial';
                ctx.fillText('Yoga Student', 400, 260);

                ctx.font = '24px Arial';
                ctx.fillText('has successfully completed the', 400, 320);
                ctx.fillText('SUNDAY Yoga Course', 400, 360);

                ctx.font = '18px Arial';
                ctx.fillStyle = '#9CA3AF';
                const today = new Date().toLocaleDateString();
                ctx.fillText(`Issued on: ${today}`, 400, 450);

                ctx.fillStyle = '#FFEB3B';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('Poses Completed:', 400, 510);
                ctx.fillText('Tadasana • Namastey • Vrikshasana', 400, 545);

                const link = document.createElement('a');
                link.download = 'SUNDAY_Yoga_Certificate.png';
                link.href = canvas.toDataURL();
                link.click();
            },
        };

        // --- Initialization on Window Load ---
        // --- Initialization on Window Load ---
        window.onload = function () {
            // Locate essential elements
            app.contentEl = document.getElementById('content');
            app.navTabsEl = document.getElementById('nav-tabs');

            // Initialize App
            app.init();

            // Hide Premium Loader after a short delay to ensure assets are ready
            setTimeout(() => {
                const loader = document.getElementById('app-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 800);
                }
            }, 1500);

            // Cursor Glow Effect Logic
            const glow = document.getElementById('cursor-glow');
            if (glow) {
                document.addEventListener('mousemove', (e) => {
                    glow.style.left = `${e.clientX}px`;
                    glow.style.top = `${e.clientY}px`;
                });
            }
        };



    </script>
